<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Change Password - AI Code Explainer</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="change-password-container">

        <div class="change-password-header">
            <h1>🔐 Change Password</h1>
            <p>Keep your AI Code Explainer account secure</p>
        </div>

        <div class="change-password-card">

            <div class="change-password-intro">
                <h2>Update Your Password</h2>
                <p>
                    Enter your current password and choose a new password.
                </p>
            </div>

            <form method="POST" action="{{ url_for('change_password') }}">

                <div class="password-field">
                    <label for="current_password">
                        Current Password
                    </label>

                    <input
                        type="password"
                        id="current_password"
                        name="current_password"
                        placeholder="Enter current password"
                        autocomplete="current-password"
                        required>
                </div>

                <div class="password-field">
                    <label for="new_password">
                        New Password
                    </label>

                    <input
                        type="password"
                        id="new_password"
                        name="new_password"
                        placeholder="Enter new password"
                        autocomplete="new-password"
                        required>
                </div>

                <div class="password-field">
                    <label for="confirm_password">
                        Confirm New Password
                    </label>

                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        placeholder="Confirm new password"
                        autocomplete="new-password"
                        required>
                </div>

                <div class="show-password">
                    <input
                        type="checkbox"
                        id="showPassword">

                    <label for="showPassword">
                        Show Password
                    </label>
                </div>

                <button type="submit">
                    🔒 Change Password
                </button>

            </form>

            <a href="{{ url_for('profile') }}" class="back-profile">
                ← Back to Profile
            </a>

        </div>

    </div>

    <script>
        const showPasswordCheckbox =
            document.getElementById("showPassword");

        showPasswordCheckbox.addEventListener("change", function () {

            const passwordFields = [
                document.getElementById("current_password"),
                document.getElementById("new_password"),
                document.getElementById("confirm_password")
            ];

            passwordFields.forEach(function (field) {
                field.type = showPasswordCheckbox.checked
                    ? "text"
                    : "password";
            });

        });
    </script>

</body>
</html>
