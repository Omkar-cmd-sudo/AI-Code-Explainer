<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verify OTP - AI Code Explainer</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="otp-container">

        <div class="otp-card">

            <div class="otp-icon">
                🔐
            </div>

            <h1>Verify OTP</h1>

            <p>
                Enter the 6-digit OTP sent to your registered email.
            </p>

            {% if error %}
                <div class="otp-error">
                    {{ error }}
                </div>
            {% endif %}

            <form method="POST" action="/verify-forgot-password-otp">

                <input type="text"
                       name="otp"
                       placeholder="Enter 6-digit OTP"
                       maxlength="6"
                       pattern="[0-9]{6}"
                       inputmode="numeric"
                       required>

                <button type="submit">
                    Verify OTP
                </button>

            </form>

            <a href="{{ url_for('resend_forgot_password_otp') }}" class="resend-otp">
               Resend OTP
            </a>

            <a href="/forgot-password" class="back-login">
                ← Back to Forgot Password
            </a>
            
        </div>

    </div>

</body>
</html>
